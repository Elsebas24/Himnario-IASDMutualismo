<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Himnario Adventista</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #141e30 0%, #243b55 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(252, 70, 107, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 40% 80%, rgba(103, 178, 111, 0.3) 0%, transparent 50%);
            pointer-events: none;
            z-index: 1;
            animation: gradientMove 15s ease infinite;
        }

        /* Imágenes decorativas */
        .decorative-image {
            position: fixed;
            z-index: 1;
            pointer-events: none;
            opacity: 0.8;
            transition: all 0.3s ease;
        }

        .decorative-image.bottom-left {
            bottom: 20px;
            left: 20px;
            max-width: 200px;
            max-height: 200px;
        }

        .decorative-image.top-right {
            top: 20px;
            right: 20px;
            max-width: 200px;
            max-height: 200px;
        }

        /* Footer de créditos */
        .footer-credits {
            position: fixed;
            bottom: 15px;
            right: 15px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 15px 20px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
            z-index: 3;
            max-width: 280px;
            transition: all 0.3s ease;
        }

        .footer-credits:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.3);
        }

        .credits-title {
            font-size: 0.7rem;
            font-weight: 600;
            color: #667eea;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            text-align: center;
        }

        .credits-org {
            font-size: 0.85rem;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 10px;
            text-align: center;
            line-height: 1.3;
        }

        .credits-divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, #667eea, transparent);
            margin: 10px 0;
        }

        .credits-team {
            font-size: 0.7rem;
            color: #7f8c8d;
            text-align: center;
            line-height: 1.5;
        }

        .credits-team strong {
            color: #2c3e50;
            font-weight: 600;
        }

        .credits-name {
            display: block;
            margin-top: 3px;
        }

        @media (max-width: 768px) {
            .decorative-image.bottom-left,
            .decorative-image.top-right {
                max-width: 120px;
                max-height: 120px;
            }
            
            .decorative-image.bottom-left {
                bottom: 10px;
                left: 10px;
            }
            
            .decorative-image.top-right {
                top: 10px;
                right: 10px;
            }

            .footer-credits {
                bottom: 10px;
                right: 10px;
                left: 10px;
                max-width: calc(100% - 20px);
                padding: 12px 15px;
            }

            .credits-title {
                font-size: 0.65rem;
            }

            .credits-org {
                font-size: 0.75rem;
            }

            .credits-team {
                font-size: 0.65rem;
            }
        }

        @media (min-width: 769px) and (max-width: 1024px) {
            .footer-credits {
                max-width: 260px;
                padding: 14px 18px;
            }

            .credits-title {
                font-size: 0.68rem;
            }

            .credits-org {
                font-size: 0.8rem;
            }

            .credits-team {
                font-size: 0.68rem;
            }
        }

        @keyframes gradientMove {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 0.8; }
        }

        /* Notas musicales flotantes */
        .musical-note {
            position: fixed;
            font-size: 2rem;
            color: rgba(255, 255, 255, 0.1);
            animation: float 20s infinite ease-in-out;
            z-index: 1;
            pointer-events: none;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) rotate(360deg);
                opacity: 0;
            }
        }

        .musical-note:nth-child(1) { left: 10%; animation-delay: 0s; }
        .musical-note:nth-child(2) { left: 20%; animation-delay: 4s; }
        .musical-note:nth-child(3) { left: 30%; animation-delay: 2s; }
        .musical-note:nth-child(4) { left: 40%; animation-delay: 6s; }
        .musical-note:nth-child(5) { left: 50%; animation-delay: 1s; }
        .musical-note:nth-child(6) { left: 60%; animation-delay: 5s; }
        .musical-note:nth-child(7) { left: 70%; animation-delay: 3s; }
        .musical-note:nth-child(8) { left: 80%; animation-delay: 7s; }
        .musical-note:nth-child(9) { left: 90%; animation-delay: 4s; }

        .container {
            text-align: center;
            width: 100%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.95);
            padding: 60px 50px;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            position: relative;
            z-index: 2;
            backdrop-filter: blur(20px);
        }

        .header {
            margin-bottom: 50px;
        }

        .titulo {
            color: #2c3e50;
            font-family: 'Segoe UI', sans-serif;
            font-size: 2.5rem;
            font-weight: 600;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        .subtitulo {
            color: #7f8c8d;
            font-family: 'Segoe UI', sans-serif;
            font-size: 1rem;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .search-section {
            background: transparent;
            padding: 0;
            border-radius: 0;
            margin-bottom: 0;
            border: none;
        }

        .search-container {
            display: flex;
            justify-content: center;
            align-items: stretch;
            gap: 0;
            margin-bottom: 35px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            border-radius: 50px;
            overflow: hidden;
        }

        #numHimno {
            flex: 1;
            padding: 18px 30px;
            font-size: 1.3rem;
            background: white;
            border: none;
            text-align: center;
            color: #2c3e50;
            outline: none;
            font-family: 'Segoe UI', sans-serif;
            font-weight: 500;
        }

        #numHimno::placeholder {
            color: #bdc3c7;
            font-weight: 400;
        }

        .btn-buscar {
            width: 70px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-buscar:hover {
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
            transform: scale(1.05);
        }

        .btn-buscar:active {
            transform: scale(0.95);
        }

        .tipo-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn-tipo {
            flex: 1;
            min-width: 100px;
            padding: 15px 25px;
            font-size: 0.95rem;
            font-weight: 500;
            background: #f8f9fa;
            color: #2c3e50;
            border: 2px solid transparent;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: 'Segoe UI', sans-serif;
            position: relative;
            overflow: hidden;
        }

        .btn-tipo::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(103, 126, 234, 0.1);
            transition: width 0.6s, height 0.6s, top 0.6s, left 0.6s;
            transform: translate(-50%, -50%);
        }

        .btn-tipo:hover::before {
            width: 300px;
            height: 300px;
        }

        .btn-tipo:hover {
            border-color: #667eea;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(103, 126, 234, 0.2);
        }

        .btn-tipo.activo {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: transparent;
            box-shadow: 0 8px 25px rgba(103, 126, 234, 0.4);
            transform: translateY(-2px);
        }

        .btn-tipo.activo::before {
            display: none;
        }

        .status {
            color: #7f8c8d;
            font-size: 0.95rem;
            min-height: 30px;
            margin-top: 25px;
            padding: 12px 20px;
            border-radius: 12px;
            transition: all 0.3s;
            font-family: 'Segoe UI', sans-serif;
            font-weight: 500;
        }

        .status.success {
            background: linear-gradient(135deg, #d4edda 0%, #c3e6cb 100%);
            color: #155724;
        }

        .status.error {
            background: linear-gradient(135deg, #f8d7da 0%, #f5c6cb 100%);
            color: #721c24;
        }

        .status.loading {
            background: linear-gradient(135deg, #d1ecf1 0%, #bee5eb 100%);
            color: #0c5460;
        }

        /* Modal pantalla completa limpia */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            z-index: 1000;
            overflow: hidden;
        }

        .modal.active {
            display: block;
        }

        /* Visor de PDF limpio */
        .pdf-viewer-clean {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000000;
            position: relative;
        }

        .pdf-canvas-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .pdf-canvas {
            position: absolute;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out;
            opacity: 1;
        }

        .pdf-canvas.fade-out {
            opacity: 0;
            transform: scale(0.98);
        }

        .pdf-canvas.fade-in {
            opacity: 0;
            transform: scale(1.02);
        }

        .pdf-canvas.visible {
            opacity: 1;
            transform: scale(1);
        }

        /* Canvas de carga inicial */
        #pdfCanvasTemp {
            position: absolute;
            z-index: 1;
        }

        #pdfCanvas {
            position: absolute;
            z-index: 2;
        }

        /* Controles minimalistas solo para PDF */
        .pdf-controls-minimal {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 10;
        }

        .modal:hover .pdf-controls-minimal {
            opacity: 1;
        }

        .btn-minimal {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.5);
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.5rem;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .btn-minimal:hover {
            background: rgba(255, 255, 255, 0.4);
            border-color: rgba(255, 255, 255, 0.8);
            transform: scale(1.1);
        }

        .btn-minimal:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .btn-minimal:disabled:hover {
            transform: scale(1);
        }

        /* Reproductor de video limpio */
        .video-viewer-clean {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000000;
        }

        .video-viewer-clean video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            outline: none;
        }

        /* Responsivo para móviles pequeños */
        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            .container {
                padding: 30px 20px;
                max-width: 95%;
                border-radius: 20px;
            }

            .header {
                margin-bottom: 30px;
            }

            .titulo {
                font-size: 1.6rem;
                margin-bottom: 5px;
            }

            .subtitulo {
                font-size: 0.75rem;
                letter-spacing: 1.5px;
            }

            .search-container {
                flex-direction: column;
                border-radius: 20px;
                margin-bottom: 25px;
            }

            #numHimno {
                font-size: 1rem;
                padding: 15px 20px;
                border-radius: 20px 20px 0 0;
            }

            .btn-buscar {
                width: 100%;
                height: 50px;
                font-size: 1.3rem;
                border-radius: 0 0 20px 20px;
            }

            .tipo-container {
                flex-direction: column;
                gap: 10px;
            }

            .btn-tipo {
                width: 100%;
                max-width: 100%;
                min-width: auto;
                padding: 12px 20px;
                font-size: 0.9rem;
            }

            .status {
                font-size: 0.85rem;
                padding: 10px 15px;
                margin-top: 20px;
            }

            .musical-note {
                font-size: 1.5rem;
            }

            .decorative-image.bottom-left,
            .decorative-image.top-right {
                max-width: 80px;
                max-height: 80px;
            }

            .decorative-image.bottom-left {
                bottom: 5px;
                left: 5px;
            }

            .decorative-image.top-right {
                top: 5px;
                right: 5px;
            }

            .footer-credits {
                bottom: 5px;
                right: 5px;
                left: 5px;
                max-width: calc(100% - 10px);
                padding: 10px 12px;
                border-radius: 12px;
            }

            .credits-title {
                font-size: 0.6rem;
                margin-bottom: 6px;
            }

            .credits-org {
                font-size: 0.7rem;
                margin-bottom: 8px;
            }

            .credits-divider {
                margin: 8px 0;
            }

            .credits-team {
                font-size: 0.6rem;
            }

            .pdf-controls-minimal {
                bottom: 15px;
                gap: 15px;
            }

            .btn-minimal {
                width: 45px;
                height: 45px;
                font-size: 1.3rem;
            }
        }

        /* Responsivo para móviles medianos y grandes */
        @media (min-width: 481px) and (max-width: 768px) {
            body {
                padding: 15px;
            }

            .container {
                padding: 40px 30px;
                max-width: 90%;
            }

            .titulo {
                font-size: 2rem;
            }

            .subtitulo {
                font-size: 0.85rem;
            }

            #numHimno {
                font-size: 1.1rem;
                padding: 15px 25px;
            }

            .btn-buscar {
                width: 60px;
            }

            .tipo-container {
                flex-direction: column;
                gap: 12px;
            }

            .btn-tipo {
                max-width: 100%;
                padding: 14px 22px;
            }

            .decorative-image.bottom-left,
            .decorative-image.top-right {
                max-width: 120px;
                max-height: 120px;
            }
            
            .decorative-image.bottom-left {
                bottom: 10px;
                left: 10px;
            }
            
            .decorative-image.top-right {
                top: 10px;
                right: 10px;
            }

            .footer-credits {
                bottom: 10px;
                right: 10px;
                left: 10px;
                max-width: calc(100% - 20px);
                padding: 12px 15px;
            }

            .credits-title {
                font-size: 0.65rem;
            }

            .credits-org {
                font-size: 0.75rem;
            }

            .credits-team {
                font-size: 0.65rem;
            }
        }

        /* Responsivo para tablets */
        @media (min-width: 769px) and (max-width: 1024px) {
            .container {
                max-width: 550px;
                padding: 55px 45px;
            }

            .titulo {
                font-size: 2.3rem;
            }

            .subtitulo {
                font-size: 0.95rem;
            }

            #numHimno {
                font-size: 1.2rem;
                padding: 17px 28px;
            }

            .btn-buscar {
                width: 65px;
            }

            .btn-tipo {
                padding: 14px 23px;
                font-size: 0.9rem;
            }

            .decorative-image.bottom-left,
            .decorative-image.top-right {
                max-width: 160px;
                max-height: 160px;
            }

            .decorative-image.bottom-left {
                bottom: 15px;
                left: 15px;
            }
            
            .decorative-image.top-right {
                top: 15px;
                right: 15px;
            }

            .footer-credits {
                max-width: 260px;
                padding: 14px 18px;
            }

            .credits-title {
                font-size: 0.68rem;
            }

            .credits-org {
                font-size: 0.8rem;
            }

            .credits-team {
                font-size: 0.68rem;
            }
        }

        /* Responsivo para pantallas grandes */
        @media (min-width: 1025px) and (max-width: 1440px) {
            .container {
                max-width: 520px;
            }

            .decorative-image.bottom-left,
            .decorative-image.top-right {
                max-width: 180px;
                max-height: 180px;
            }
        }

        /* Responsivo para pantallas extra grandes */
        @media (min-width: 1441px) {
            .container {
                max-width: 550px;
                padding: 65px 55px;
            }

            .titulo {
                font-size: 2.7rem;
            }

            .decorative-image.bottom-left,
            .decorative-image.top-right {
                max-width: 220px;
                max-height: 220px;
            }

            .footer-credits {
                max-width: 300px;
                padding: 16px 22px;
            }
        }

        /* Orientación landscape en móviles */
        @media (max-width: 768px) and (orientation: landscape) {
            .container {
                max-width: 80%;
                padding: 30px 35px;
            }

            .header {
                margin-bottom: 30px;
            }

            .titulo {
                font-size: 1.8rem;
            }

            .search-container {
                margin-bottom: 25px;
            }

            .tipo-container {
                flex-direction: row;
                flex-wrap: wrap;
            }

            .btn-tipo {
                flex: 1;
                min-width: 120px;
            }

            .decorative-image.bottom-left,
            .decorative-image.top-right {
                max-width: 100px;
                max-height: 100px;
            }

            .footer-credits {
                max-width: 240px;
                padding: 10px 14px;
                right: 10px;
                left: auto;
            }
        }
    </style>
</head>
<body>
    <!-- Notas musicales flotantes -->
    <div class="musical-note">♪</div>
    <div class="musical-note">♫</div>
    <div class="musical-note">♪</div>
    <div class="musical-note">♫</div>
    <div class="musical-note">♪</div>
    <div class="musical-note">♫</div>
    <div class="musical-note">♪</div>
    <div class="musical-note">♫</div>
    <div class="musical-note">♪</div>

    <!-- Imágenes decorativas -->
    <img src="../Himnario-IASDMutualismo/recursos/LogoIASDMutualismo.png" alt="Logo Mutualismo" class="decorative-image bottom-left" id="imagenInferiorIzq" width="150" height="150">
    <img src="../Himnario-IASDMutualismo/recursos/LogoIASD.png" alt="Logo IASD" class="decorative-image top-right" id="imagenSuperiorDer" width="150" height="150">

    <div class="container">
        <div class="header">
            <h1 class="titulo">Himnario Adventista</h1>
        </div>

        <div class="search-section">
            <div class="search-container">
                <input 
                    type="number" 
                    id="numHimno" 
                    placeholder="Número del himno" 
                    min="1"
                    max="999"
                    autofocus
                >
                <button class="btn-buscar" onclick="buscarHimno()" title="Buscar">▶</button>
            </div>

            <div class="tipo-container">
                <button class="btn-tipo activo" data-tipo="L" data-ext="pdf" onclick="seleccionarTipo(this)">
                    Letra
                </button>
                <button class="btn-tipo" data-tipo="P" data-ext="mp4" onclick="seleccionarTipo(this)">
                    Pista
                </button>
                <button class="btn-tipo" data-tipo="C" data-ext="mp4" onclick="seleccionarTipo(this)">
                    Cantar
                </button>
            </div>
        </div>

        <div class="status" id="status"></div>
    </div>

    <!-- Modal pantalla completa limpia -->
    <div class="modal" id="modal">
        <!-- Visor PDF -->
        <div class="pdf-viewer-clean" id="pdfViewer" style="display: none;">
            <div class="pdf-canvas-container">
                <canvas id="pdfCanvasTemp" class="pdf-canvas"></canvas>
                <canvas id="pdfCanvas" class="pdf-canvas"></canvas>
            </div>
            
            <!-- Controles minimalistas -->
            <div class="pdf-controls-minimal" id="pdfControls">
                <button class="btn-minimal" id="btnPrev" onclick="paginaAnterior()" title="Anterior (←)">
                    ←
                </button>
                <button class="btn-minimal" onclick="cerrarModal()" title="Cerrar (ESC)">
                    ✕
                </button>
                <button class="btn-minimal" id="btnNext" onclick="paginaSiguiente()" title="Siguiente (→)">
                    →
                </button>
            </div>
        </div>

        <!-- Reproductor de video -->
        <div class="video-viewer-clean" id="videoViewer" style="display: none;">
            <video id="videoElement" controls></video>
        </div>
    </div>

    <!-- PDF.js library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <script>
        let tipoSeleccionado = 'L';
        let extensionActual = 'pdf';
        let pdfDoc = null;
        let pageNum = 1;
        let pageRendering = false;
        let pageNumPending = null;
        let scale = 1.5;
        let modalActivo = false;
        let pageCache = {}; // Caché para páginas renderizadas
        
        const RUTA_BASE = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
            ? 'himnos/'
            : '/Himnario-IASDMutualismo/himnos/';

        // Configurar PDF.js
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        document.getElementById('numHimno').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                buscarHimno();
            }
        });

        function seleccionarTipo(btn) {
            document.querySelectorAll('.btn-tipo').forEach(b => {
                b.classList.remove('activo');
            });
            
            btn.classList.add('activo');
            tipoSeleccionado = btn.getAttribute('data-tipo');
            extensionActual = btn.getAttribute('data-ext');
        }

        function buscarHimno() {
            const numeroHimno = document.getElementById('numHimno').value.trim();
            const statusDiv = document.getElementById('status');

            statusDiv.className = 'status';

            if (!numeroHimno) {
                mostrarEstado('Por favor ingrese un número de himno', 'error');
                return;
            }

            const nombreArchivo = construirNombreArchivo(numeroHimno, tipoSeleccionado, extensionActual);
            const rutaCompleta = RUTA_BASE + nombreArchivo;

            console.log('Buscando archivo en:', rutaCompleta);
            mostrarEstado('Buscando archivo...', 'loading');
            
            if (extensionActual === 'pdf') {
                verificarYAbrirPDF(rutaCompleta, nombreArchivo, numeroHimno);
            } else {
                verificarYAbrirVideo(rutaCompleta, nombreArchivo, numeroHimno);
            }
        }

        function construirNombreArchivo(numero, tipo, extension) {
            const numeroFormateado = numero.padStart(3, '0');
            return `himno_${numeroFormateado}_${tipo}.${extension}`;
        }

        function verificarYAbrirPDF(ruta, nombre, numero) {
            fetch(ruta, { method: 'HEAD' })
                .then(response => {
                    if (response.ok) {
                        mostrarEstado('Archivo encontrado. Abriendo...', 'success');
                        abrirPDF(ruta);
                    } else {
                        mostrarEstado('No se encontró el archivo: ' + nombre, 'error');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    mostrarEstado('Error al buscar el archivo', 'error');
                });
        }

        function verificarYAbrirVideo(ruta, nombre, numero) {
            const video = document.createElement('video');
            video.src = ruta;
            
            video.addEventListener('canplay', function() {
                mostrarEstado('Archivo encontrado. Reproduciendo...', 'success');
                abrirVideo(ruta);
            }, { once: true });
            
            video.addEventListener('error', function() {
                mostrarEstado('No se encontró el archivo: ' + nombre, 'error');
            }, { once: true });
        }

        function abrirPDF(ruta) {
            const modal = document.getElementById('modal');
            const pdfViewer = document.getElementById('pdfViewer');
            const videoViewer = document.getElementById('videoViewer');
            const canvasActual = document.getElementById('pdfCanvas');

            videoViewer.style.display = 'none';
            pdfViewer.style.display = 'flex';
            
            // Iniciar con el canvas invisible para la primera carga
            canvasActual.classList.remove('visible', 'fade-in', 'fade-out');
            canvasActual.classList.add('fade-in');
            
            modal.classList.add('active');
            modalActivo = true;
            pageNum = 1;

            cargarPDF(ruta);
        }

        function abrirVideo(ruta) {
            const modal = document.getElementById('modal');
            const pdfViewer = document.getElementById('pdfViewer');
            const videoViewer = document.getElementById('videoViewer');
            const videoElement = document.getElementById('videoElement');

            pdfViewer.style.display = 'none';
            videoViewer.style.display = 'flex';
            modal.classList.add('active');
            modalActivo = true;

            videoElement.src = ruta;
            videoElement.load();
            videoElement.play();

            // Cuando termina el video, cerrar automáticamente
            videoElement.onended = function() {
                cerrarModal();
            };
        }

        function cerrarModal() {
            const modal = document.getElementById('modal');
            const videoElement = document.getElementById('videoElement');
            
            videoElement.pause();
            videoElement.src = '';
            modal.classList.remove('active');
            modalActivo = false;
            
            if (pdfDoc) {
                pdfDoc = null;
                pageNum = 1;
                pageCache = {}; // Limpiar caché al cerrar
            }
        }

        // Funciones para manejar PDF
        function cargarPDF(url) {
            pageCache = {}; // Limpiar caché al cargar nuevo PDF
            const loadingTask = pdfjsLib.getDocument(url);
            loadingTask.promise.then(function(pdf) {
                pdfDoc = pdf;
                renderizarPagina(pageNum);
                // Precargar las siguientes 3 páginas
                precargarPaginas();
            });
        }

        function precargarPaginas() {
            if (!pdfDoc) return;
            
            // Precargar página siguiente, la de después y la anterior
            const paginasAPrecargar = [pageNum + 1, pageNum + 2, pageNum - 1];
            
            paginasAPrecargar.forEach(num => {
                if (num >= 1 && num <= pdfDoc.numPages && !pageCache[num]) {
                    renderizarPaginaEnCache(num);
                }
            });
        }

        function renderizarPaginaEnCache(num) {
            pdfDoc.getPage(num).then(function(page) {
                // Crear un canvas temporal para el caché
                const tempCanvas = document.createElement('canvas');
                const tempCtx = tempCanvas.getContext('2d');
                
                const viewport = page.getViewport({scale: 1});
                const windowWidth = window.innerWidth;
                const windowHeight = window.innerHeight;
                
                const scaleX = windowWidth / viewport.width;
                const scaleY = windowHeight / viewport.height;
                const optimalScale = Math.max(scaleX, scaleY);
                
                const scaledViewport = page.getViewport({scale: optimalScale});
                
                tempCanvas.height = scaledViewport.height;
                tempCanvas.width = scaledViewport.width;
                
                const renderContext = {
                    canvasContext: tempCtx,
                    viewport: scaledViewport
                };
                
                page.render(renderContext).promise.then(function() {
                    // Guardar imagen en caché
                    pageCache[num] = tempCanvas.toDataURL();
                });
            });
        }

        function renderizarPagina(num) {
            if (pageRendering) {
                pageNumPending = num;
                return;
            }
            
            pageRendering = true;
            const canvasActual = document.getElementById('pdfCanvas');
            const canvasTemp = document.getElementById('pdfCanvasTemp');
            
            pdfDoc.getPage(num).then(function(page) {
                // Calcular escala para llenar toda la pantalla
                const viewport = page.getViewport({scale: 1});
                const windowWidth = window.innerWidth;
                const windowHeight = window.innerHeight;
                
                const scaleX = windowWidth / viewport.width;
                const scaleY = windowHeight / viewport.height;
                const optimalScale = Math.max(scaleX, scaleY);
                
                const scaledViewport = page.getViewport({scale: optimalScale});

                // Si hay imagen en caché, mostrarla inmediatamente en canvas temporal
                if (pageCache[num]) {
                    const img = new Image();
                    img.onload = function() {
                        canvasTemp.height = scaledViewport.height;
                        canvasTemp.width = scaledViewport.width;
                        const tempCtx = canvasTemp.getContext('2d');
                        tempCtx.drawImage(img, 0, 0, scaledViewport.width, scaledViewport.height);
                        
                        // Fade out del canvas actual
                        canvasActual.classList.add('fade-out');
                        
                        // Después de que termine el fade out, intercambiar canvas
                        setTimeout(() => {
                            canvasActual.height = scaledViewport.height;
                            canvasActual.width = scaledViewport.width;
                            const ctx = canvasActual.getContext('2d');
                            ctx.drawImage(img, 0, 0, scaledViewport.width, scaledViewport.height);
                            
                            // Fade in del nuevo contenido
                            canvasActual.classList.remove('fade-out');
                            canvasActual.classList.add('fade-in');
                            
                            setTimeout(() => {
                                canvasActual.classList.remove('fade-in');
                                canvasActual.classList.add('visible');
                                
                                // Limpiar canvas temporal
                                tempCtx.clearRect(0, 0, canvasTemp.width, canvasTemp.height);
                                
                                pageRendering = false;
                                if (pageNumPending !== null) {
                                    const pending = pageNumPending;
                                    pageNumPending = null;
                                    renderizarPagina(pending);
                                }
                                actualizarBotones();
                                precargarPaginas();
                            }, 50);
                        }, 300);
                    };
                    img.src = pageCache[num];
                } else {
                    // No hay caché, renderizar directamente con transición
                    canvasActual.classList.add('fade-out');
                    
                    setTimeout(() => {
                        canvasActual.height = scaledViewport.height;
                        canvasActual.width = scaledViewport.width;
                        const ctx = canvasActual.getContext('2d');

                        const renderContext = {
                            canvasContext: ctx,
                            viewport: scaledViewport
                        };

                        const renderTask = page.render(renderContext);
                        renderTask.promise.then(function() {
                            // Guardar en caché
                            pageCache[num] = canvasActual.toDataURL();
                            
                            // Fade in
                            canvasActual.classList.remove('fade-out');
                            canvasActual.classList.add('fade-in');
                            
                            setTimeout(() => {
                                canvasActual.classList.remove('fade-in');
                                canvasActual.classList.add('visible');
                                
                                pageRendering = false;
                                if (pageNumPending !== null) {
                                    const pending = pageNumPending;
                                    pageNumPending = null;
                                    renderizarPagina(pending);
                                }
                                actualizarBotones();
                                precargarPaginas();
                            }, 50);
                        });
                    }, 300);
                }
            });
        }

        function queueRenderPage(num) {
            if (pageRendering) {
                pageNumPending = num;
            } else {
                renderizarPagina(num);
            }
        }

        function paginaAnterior() {
            if (pageNum <= 1) {
                return;
            }
            pageNum--;
            queueRenderPage(pageNum);
        }

        function paginaSiguiente() {
            if (!pdfDoc || pageNum >= pdfDoc.numPages) {
                return;
            }
            pageNum++;
            queueRenderPage(pageNum);
        }

        function actualizarBotones() {
            document.getElementById('btnPrev').disabled = (pageNum <= 1);
            document.getElementById('btnNext').disabled = (pageNum >= pdfDoc.numPages);
        }

        function mostrarEstado(mensaje, tipo) {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = mensaje;
            statusDiv.className = `status ${tipo}`;
        }

        // Controles de teclado
        document.addEventListener('keydown', function(e) {
            if (!modalActivo) return;

            if (e.key === 'Escape') {
                cerrarModal();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                paginaAnterior();
            } else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                paginaSiguiente();
            }
        });

        // Ajustar PDF al cambiar tamaño de ventana
        window.addEventListener('resize', function() {
            if (modalActivo && pdfDoc) {
                pageCache = {}; // Limpiar caché al cambiar tamaño
                renderizarPagina(pageNum);
            }
        });
    </script>
</body>
</html>
